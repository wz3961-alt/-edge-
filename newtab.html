<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新标签页</title><link rel="stylesheet" href="newtab.css"></head><body>
<div id="background" aria-hidden="true"></div><div class="shade" aria-hidden="true"></div>
<header><button id="weather" class="weather" aria-label="查看天气详情" title="查看天气详情"><span id="weather-city">长春</span><span id="weather-icon">☀</span><span id="weather-temp">--°</span></button></header>
<main><div class="search-wrap"><form id="search" class="search" role="search"><label class="sr-only" for="query">搜索网页</label><input id="query" type="search" placeholder="搜索网页" autocomplete="off"><button aria-label="搜索" type="submit"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button></form><ul id="suggestions" class="suggestions" role="listbox" hidden></ul></div><section id="shortcuts" class="shortcuts" aria-label="网站快捷方式"></section></main>
<footer><div id="photo-credit" class="photo-credit" aria-live="polite"></div><button id="settings" title="设置天气城市">设置</button></footer>
<dialog id="shortcut-dialog"><form id="shortcut-form"><h2>添加快捷方式</h2><label>名称<input id="shortcut-name" maxlength="40" required placeholder="例如 GitHub"></label><label>网址<input id="shortcut-url" required placeholder="https://example.com"></label><p id="shortcut-error" class="error" role="alert"></p><div class="actions"><button type="button" class="cancel">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
<dialog id="city-dialog"><form id="city-form"><h2>设置</h2><label>城市名称<input id="city-query" required placeholder="例如 长春 或 Changchun"></label><p class="hint">天气由 Open-Meteo 提供，选择的城市会保存在本机。</p><div id="city-results"></div><div class="extension-settings"><button id="open-extensions" type="button">打开扩展管理</button><p id="extensions-error" class="error" role="status"></p></div><p id="city-error" class="error" role="alert"></p><div class="actions"><button type="button" class="cancel">取消</button><button class="primary" type="submit">查找</button></div></form></dialog>
<script src="newtab.js"></script></body></html>
